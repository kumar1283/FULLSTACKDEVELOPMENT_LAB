<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>String Object</title>
  </head>
  <body>
  <strong>N.Kumar<br>24K61A1283</strong><br>
    <h1>String Object</h1>
    <script>
      var str = "Hello World";
      document.write("String: " + str + "<br>");
      document.write("Length: " + str.length + "<br>");
      document.write("toUpperCase(): " + str.toUpperCase() + "<br>");
      document.write("toLowerCase(): " + str.toLowerCase() + "<br>");
      document.write("charAt(1): " + str.charAt(1) + "<br>");
      document.write("indexOf('World'): " + str.indexOf("World") + "<br>");
      document.write("substring(0, 5): " + str.substring(0, 5) + "<br>");
      document.write("slice(6): " + str.slice(6) + "<br>");
      document.write("replace: " + str.replace("World", "JavaScript") + "<br>");
      document.write("concat: " + str.concat(" Welcome") + "<br>");
      document.write("split: " + str.split(" ") + "<br>");
      document.write("trim: " + "  spaces  ".trim() + "<br>");
    </script>
  </body>
</html>
