<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML5 Semantic Tags</title>
  </head>
  <body>
    <header>
      <h1>My Website</h1>
    </header>
    <nav>
      <a href="#home">Home</a> | <a href="#about">About</a> |
      <a href="#contact">Contact</a>
    </nav>
    <main>
      <section id="home">
        <h2>Home Section</h2>
        <p>Welcome to my <span>simple</span> website.</p>
      </section>
      <section id="about">
        <h2>About Section</h2>
        <div>
          <p>This is a div inside the about section.</p>
        </div>
      </section>
    </main>
    <footer>
      <p>Copyright 2026. All rights reserved.</p>
    </footer>
  </body>
</html>
