<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Colors</title>
    <style>
      .name {
        color: red;
      }
      .hex {
        color: #0000ff;
      }
      .rgb {
        color: rgb(0, 128, 0);
      }
      .rgba {
        background-color: rgba(255, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
  <strong>N.Kumar<br>24K61A1283</strong><br>
    <h1>Referencing Colors in CSS</h1>
    <p class="name">Color name: red</p>
    <p class="hex">Hex code: #0000ff</p>
    <p class="rgb">RGB value: rgb(0, 128, 0)</p>
    <p class="rgba">RGBA value with transparency: rgba(255, 0, 0, 0.3)</p>
  </body>
</html>
