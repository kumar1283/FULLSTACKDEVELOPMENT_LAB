<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Font and Text Properties</title>
    <style>
      .size {
        font-size: 24px;
      }
      .weight {
        font-weight: bold;
      }
      .style {
        font-style: italic;
      }
      .underline {
        text-decoration: underline;
      }
      .linethrough {
        text-decoration: line-through;
      }
      .upper {
        text-transform: uppercase;
      }
      .lower {
        text-transform: lowercase;
      }
      .capital {
        text-transform: capitalize;
      }
      .left {
        text-align: left;
      }
      .center {
        text-align: center;
      }
      .right {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>Font and Text Properties</h1>
    <p class="size">font-size: 24px</p>
    <p class="weight">font-weight: bold</p>
    <p class="style">font-style: italic</p>
    <p class="underline">text-decoration: underline</p>
    <p class="linethrough">text-decoration: line-through</p>
    <p class="upper">text-transform: uppercase</p>
    <p class="lower">TEXT-TRANSFORM: LOWERCASE</p>
    <p class="capital">text-transform: capitalize</p>
    <p class="left">text-align: left</p>
    <p class="center">text-align: center</p>
    <p class="right">text-align: right</p>
  </body>
</html>
