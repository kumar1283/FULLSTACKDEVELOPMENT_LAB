<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript Output Methods</title>
  </head>
  <body>
    <h1>JavaScript Output Methods</h1>
    <p id="demo"></p>
    <script>
      document.write("<p>This is  document.write()</p>");
      document.getElementById("demo").innerHTML = "Output using innerHTML";
      console.log("Output using console.log() - see the browser console");
      alert("Output using alert()");
    </script>
  </body>
</html>
