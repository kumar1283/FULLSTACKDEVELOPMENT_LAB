<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Loops 1 to 10</title>
  </head>
  <body>
  <strong>N.Kumar<br>24K61A1283</strong><br>
    <h1>Print 1 to 10</h1>
    <script>
      document.write("<h3>Using for loop</h3>");
      for (var i = 1; i <= 10; i++) {
        document.write(i + " ");
      }
      document.write("<h3>Using while loop</h3>");
      var j = 1;
      while (j <= 10) {
        document.write(j + " ");
        j++;
      }
      document.write("<h3>Using do-while loop</h3>");
      var k = 1;
      do {
        document.write(k + " ");
        k++;
      } while (k <= 10);
    </script>
  </body>
</html>
