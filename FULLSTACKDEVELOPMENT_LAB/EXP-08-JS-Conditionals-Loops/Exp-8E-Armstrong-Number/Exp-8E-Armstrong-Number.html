<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Armstrong Number</title>
  </head>
  <body>
    <h1>Armstrong Number Check</h1>
    <script>
      var num = Number(prompt("Enter a number (example 153):"));
      var temp = num;
      var sum = 0;
      while (temp > 0) {
        var digit = temp % 10;
        sum = sum + digit * digit * digit;
        temp = Math.floor(temp / 10);
      }
      if (sum == num) {
        document.write(num + " is an Armstrong number");
      } else {
        document.write(num + " is not an Armstrong number");
      }
    </script>
  </body>
</html>
