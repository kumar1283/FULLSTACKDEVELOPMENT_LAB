<!doctype html>
<html>
  <head>
    <title>Attribute Selectors</title>
    <style>
      a[target] {
        color: blue;
      }

      input[type="text"] {
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <h1>Attribute Selectors</h1>

    <a href="https://google.com" target="_blank">Google</a>
    <br /><br />

    <input type="text" placeholder="Enter name" />
  </body>
</html>
