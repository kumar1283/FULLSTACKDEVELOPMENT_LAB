<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Selectors</title>
    <style>
      h1 {
        color: blue;
      }
      #special {
        color: red;
      }
      .note {
        background-color: yellow;
      }
      h3,
      h4 {
        color: green;
      }
      * {
        font-family: Arial;
        background-color: rgb(180, 231, 231);
      }
    </style>
  </head>
  <body>
  <strong>N.Kumar<br>24K61A1283</strong><br>
    <h1>Element Selector</h1>
    <p id="special">ID Selector</p>
    <p class="note">Class Selector</p>
    <h3>Group Selector h3</h3>
    <h4>Group Selector h4</h4>
    <p>Universal Selector applies Arial font to everything</p>
  </body>
</html>
