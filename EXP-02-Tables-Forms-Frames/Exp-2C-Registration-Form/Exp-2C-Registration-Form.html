<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Registration Form</title>
  </head>
  <body>
  <strong>N.Kumar<br>24K61A1283</strong><br>
    <h1 align="center">Registration Form</h1>
    <form>
      <table border="1" cellpadding="8" align="center">
        <tr>
          <td>Name</td>
          <td><input type="text" placeholder="Enter Name" /></td>
        </tr>
        <tr>
          <td>Password</td>
          <td>
            <input type="password" placeholder="Enter Password" />
          </td>
        </tr>
        <tr>
          <td>Age</td>
          <td><input type="number" placeholder="Enter Your Age" /></td>
        </tr>
        <tr>
          <td>Date of Birth</td>
          <td><input type="date" /></td>
        </tr>
        <tr>
          <td>Gender</td>
          <td>
            <input type="radio" value="male" />Male
            <input type="radio" value="female" />Female
          </td>
        </tr>
        <tr>
          <td>Hobbies</td>
          <td>
            <input type="checkbox" value="reading" />Reading
            <input type="checkbox" value="music" />Music
            <input type="checkbox" value="sports" />Sports
          </td>
        </tr>
        <tr>
          <td>Languages Known</td>
          <td>
            <select name="languages" size="3" multiple>
              <option>Telugu</option>
              <option>Hindi</option>
              <option>English</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Course</td>
          <td>
            <select name="course">
              <option>B.Tech</option>
              <option>B.Sc</option>
              <option>BCA</option>
            </select>
          </td>
        </tr>
        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="Submit" />
            <input type="reset" value="Reset" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
