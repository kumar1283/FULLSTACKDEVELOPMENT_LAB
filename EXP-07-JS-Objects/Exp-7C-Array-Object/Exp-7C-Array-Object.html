<!doctype html>
<html>
  <head>
    <title>Array Object</title>
  </head>
  <body>
  <strong>N.Kumar<br>24K61A1283</strong><br>
    <h2>JavaScript Array Object</h2>

    <script>
      // Creating an array
      let fruits = ["Apple", "Banana", "Mango"];

      // Array property
      document.write("Length: " + fruits.length + "<br>");

      // Array methods
      fruits.push("Orange");
      document.write("After Push: " + fruits + "<br>");

      fruits.pop();
      document.write("After Pop: " + fruits + "<br>");

      fruits.sort();
      document.write("After Sort: " + fruits + "<br>");
    </script>
  </body>
</html>
