<!doctype html>
<html>
  <head>
    <title>Date Object</title>
  </head>
  <body>
  <strong>N.Kumar<br>24K61A1283</strong><br>
    <h2>JavaScript Date Object</h2>

    <script>
      // Creating Date object
      let d = new Date();

      // Date methods
      document.write("Date: " + d.getDate() + "<br>");
      document.write("Month: " + (d.getMonth() + 1) + "<br>");
      document.write("Year: " + d.getFullYear() + "<br>");
      document.write("Hours: " + d.getHours() + "<br>");
      document.write("Minutes: " + d.getMinutes() + "<br>");
      document.write("Current Date: " + d.toDateString());
    </script>
  </body>
</html>
