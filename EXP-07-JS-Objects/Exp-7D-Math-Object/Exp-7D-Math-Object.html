<!doctype html>
<html>
  <head>
    <title>Math Object</title>
  </head>
  <body>
  <strong>N.Kumar<br>24K61A1283</strong><br>
    <h2>JavaScript Math Object</h2>

    <script>
      // Math properties
      document.write("PI: " + Math.PI + "<br>");
      document.write("E: " + Math.E + "<br>");

      // Math methods
      document.write("Square root: " + Math.sqrt(25) + "<br>");
      document.write("Power: " + Math.pow(2, 3) + "<br>");
      document.write("Round: " + Math.round(3.6) + "<br>");
      document.write("Maximum: " + Math.max(10, 20, 30) + "<br>");
    </script>
  </body>
</html>
