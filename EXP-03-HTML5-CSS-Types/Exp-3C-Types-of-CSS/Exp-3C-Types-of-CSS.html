<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Types of CSS</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      h2 {
        color: blue;
      }
    </style>
  </head>
  <body>
  <strong>N.Kumar<br>24K61A1283</strong><br>
    <h1>Types of CSS</h1>
    <h2>Internal CSS: this heading is blue</h2>

    <p class="External">
      External CSS: this paragraph is green with a yellow background
    </p>

    <p style="color: red; font-size: 20px">Inline CSS: this paragraph is red</p>

    <h3>Selector, Property and Value</h3>
    <p>Example: h2 { color: blue; }</p>
    <p>Selector = h2</p>
    <p>Property = color</p>
    <p>Value = blue</p>
  </body>
</html>
